<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button>按钮</button>

    <script>
      // 内置函数(第三方库): 根据一些经验
      // 1.定时器  window
      setTimeout(function () {
        console.log("定时器函数:", this); // window
      }, 1000);

      // 2.按钮的点击监听  btnEl
      var btnEl = document.querySelector("button");
      btnEl.onclick = function () {
        console.log("btn的点击:", this); // btnEl <button>按钮</button>
      };

      btnEl.addEventListener("click", function () {
        console.log("btn的点击:", this); // btnEl <button>按钮</button>
      });

      // // 3.forEach  window
      var names = ["abc", "cba", "nba"];

      obj = { name: "coder" };
      names.forEach(function (item) {
        console.log("forEach(没有第二个参数):", this, item); // 三次window
      });

      names.forEach(function (item) {
        console.log("forEach(有第二个参数):", this, item); // 三次obj
      }, obj);
    </script>
  </body>
</html>
