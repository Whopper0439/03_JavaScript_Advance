<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // promise赋值
      let a;

      let b = new Promise((resolve) => {
        console.log(1);

        setTimeout(() => {
          resolve();
        }, 100);
      }).then(() => {
        console.log(2);
      });

      a = new Promise(async (resolve) => {
        console.log(a);

        await b;

        console.log(a);

        console.log(3);

        await a;

        resolve(true);

        console.log(4);
      });

      console.log(5);
    </script>
  </body>
</html>
