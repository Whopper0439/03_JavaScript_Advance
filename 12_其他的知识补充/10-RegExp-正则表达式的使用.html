<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    输入账号: <input type="text" />
    <p class="tip">请输入账号</p>

    <script>
      // 创建正则
      const re1 = /abc/gi;
      const message = "fdabc123 faBC323 dfABC222 A2324aaBc";
      console.log(message);
      // 1.使用正则对象上的实例方法
      // webpack -> loader -> test: 匹配文件名
      // 正则 -> 拿到文件 -> loader操作
      // 1.1.test方法: 检测某一个字符串是否符合正则的规则,返回布尔值
      if (re1.test(message)) {
        console.log("re1.test(message)符合规则");
      } else {
        console.log("re1.test(message)不符合规则");
      }

      // 1.2.exec方法: 使用正则执行一个字符串,返回结果数组,index等
      const result1 = re1.exec(message);
      console.log("re1.exec(message):", result1);

      // 2.使用字符串的方法, 传入一个正则表达式, 返回匹配的所有字符串
      // 2.1. match方法:返回数组
      const result2 = message.match(re1);
      console.log("message.match(re1):", result2);

      // 2.2. matchAll方法, 返回匹配的所有字符串的详细信息,返回迭代器
      // 注意: matchAll传入的正则修饰符必须加g
      const result3 = message.matchAll(re1);
      console.log(result3.next());
      console.log(result3.next());
      console.log(result3.next());
      console.log(result3.next());

      // 2.3. replace/replaceAll方法:替换
      // 使用字符串的方法, 传入一个正则表达式
      // 需求: 将所有的abc(忽略大小写)换成cba
      // const newMessage = message.replaceAll("abc", "cba")  // 不能忽略大小写
      // console.log(newMessage)

      const newMessage = message.replaceAll(/abc/gi, "cba");
      console.log("cba替换abc:", newMessage); // fdcba123 fcba323 dfcba222 A2324acba

      // 需求: 将字符串中数字全部删除
      const newMessage2 = message.replaceAll(/\d+/gi, "");
      console.log("删除数字:   ", newMessage2); // fdabc faBC dfABC AaaBc

      // 2.4. split方法:切割
      const result4 = message.split(re1);
      console.log("message.split(re1):", result4);

      // 2.5. search方法:搜索,返回索引
      const result5 = message.search(re1);
      console.log("message.search(re1):", result5);

      // 案例: 让用户输入的账号必须是aaaaa以上
      const inputEl = document.querySelector("input");
      const tipEl = document.querySelector(".tip");

      inputEl.oninput = function () {
        const value = this.value;
        if (/^a{5,8}$/.test(value)) {
          tipEl.textContent = "输入的内容符合规则要求";
        } else {
          tipEl.textContent = "输入的内容不符合规则要求, 请重新输入";
        }
      };
    </script>
  </body>
</html>
