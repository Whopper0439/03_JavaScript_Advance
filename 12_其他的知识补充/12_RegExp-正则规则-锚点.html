<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const message = "My name is WHY.";

      // 字符串方法(严格大小写)
      if (message.startsWith("my")) {
        console.log("message.startsWith('my'),以my开头");
      }
      if (message.endsWith("why")) {
        console.log("message.endsWith('why'),以why结尾");
      }

      // 正则: 锚点
      if (/^my/i.test(message)) {
        console.log("/^my/i.test(message),以my开头");
      }

      // .  匹配任意字符
      // \. 真正的.
      if (/why\.$/i.test(message)) {
        console.log("/why\.$/i.test(message),以why结尾");
      }

      const re = /^coder$/;
      const info = "codeaaar";
      console.log(re.test(info)); // false
    </script>
  </body>
</html>
