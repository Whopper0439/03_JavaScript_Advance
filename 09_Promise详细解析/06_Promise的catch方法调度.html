<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const promise = new Promise((resolve, reject) => {
        reject("failure");
      });

      // 报错:Uncaught (in promise) failure
      // 只捕获了成功回调,没有捕获错误的回调
      // promise.then((res) => {
      //   console.log("成功的回调:", res);
      // });

      promise
        .catch((err) => {
          console.log("失败的回调1:", err); // failure
        })
        .catch((err) => {
          console.log("失败的回调:", err); // 不执行
        })
        .then((res) => {
          console.log("成功的回调4:", res); // undefined
        });
      // .catch((err) => {
      //   console.log("失败的回调3:", err); // failure
      // });

      promise.catch((err) => {
        console.log("失败的回调2:", err); // failure
      });
      promise.catch((err) => {
        console.log("失败的回调3:", err); // failure
      });
    </script>
  </body>
</html>
