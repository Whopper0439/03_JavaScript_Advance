    <script>
      // 通过限制并发数，实现了并行执行任务的功能。
      // 它会将源数据中的每个元素传递给迭代函数进行处理，将处理结果包装成 Promise 对象，并控制最大并发数，等待其中一个任务完成后再继续执行下一个任务，最后返回一个包含所有任务结果的 Promise 对象。
      // async function runParallel(maxConcurrency, source, iteratorFn) {
      //   const ret = [];
      //   const executing = [];
      //   for (const item of source) {
      //     const p = Promise.resolve().then(() => iteratorFn(item, source));
      //     ret.push(p);

      //     if (maxConcurrency <= source.length) {
      //       const e = p.then(() => executing.splice(executing.indexOf(e), 1));
      //       executing.push(e);
      //       if (executing.length >= maxConcurrency) {
      //         await Promise.race(executing);
      //       }
      //     }
      //   }
      //   return Promise.all(ret);
      // }

      async function runParallel(maxConcurrency, source, iteratorFn) {
        const results = new Array(source.length);
        const executing = []; // 存储正在执行的任务的 Promise
        let index = 0;

        const enqueue = async () => {
          if (index >= source.length) return;
          const currentIndex = index++;
          const item = source[currentIndex];

          // 执行任务，捕获错误而不中断流程（根据业务需求可调整）
          const p = Promise.resolve()
            .then(() => iteratorFn(item, source))
            .then((result) => {
              results[currentIndex] = result;
            })
            .catch((err) => {
              // 可以决定是存储错误还是直接抛出，这里选择存储错误对象
              results[currentIndex] = err;
            })
            .finally(() => {
              // 无论成功或失败，都从 executing 中移除自己
              const pos = executing.indexOf(p);
              if (pos !== -1) executing.splice(pos, 1);
            });

          executing.push(p);

          // 如果并发数达到上限，等待任意一个完成
          if (executing.length >= maxConcurrency) {
            await Promise.race(executing);
          }

          // 继续处理下一个
          await enqueue();
        };

        // 启动 maxConcurrency 个“工作协程”
        const workers = Array(Math.min(maxConcurrency, source.length))
          .fill()
          .map(() => enqueue());
        await Promise.all(workers);

        // 最终所有任务完成，检查是否有错误需要抛出
        const anyError = results.some((r) => r instanceof Error);
        if (anyError) {
          throw new AggregateError(
            results.filter((r) => r instanceof Error),
            "Some tasks failed",
          );
        }
        return results;
      }
    </script>
